<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futbol AR Collection</title>
  <!-- Google Model-Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #111; color: white; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    .info { position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; pointer-events: none; }
    .ar-btn {
      position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
      background: #007bff; color: white; border: none; padding: 14px 28px;
      font-size: 16px; font-weight: bold; border-radius: 30px; z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="info">
    <h2 id="p-name">CRISTIANO RONALDO</h2>
    <p>3D AR Modell</p>
  </div>

  <!-- Göni model.glb diýen taýýar faýlyňyzy okaýar -->
  <model-viewer 
    id="viewer"
    src="model.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-placement="floor"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1">
    <button slot="ar-button" class="ar-btn">📷 Ýanymda Görkez (3D AR)</button>
  </model-viewer>

  <script>
    // Linkden id okamak (?id=ronaldo)
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    const pName = document.getElementById('p-name');
    if (id) {
      pName.innerText = id.toUpperCase();
    }
  </script>

</body>
</html>
