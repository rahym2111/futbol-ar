<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realny AR Futbolçy</title>
  
  <!-- Google Model-Viewer Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; background-color: #0d1117; color: white; font-family: sans-serif; }
    
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    .header-info {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 20px;
      text-align: center;
      z-index: 100;
    }
    .player-title { font-size: 18px; font-weight: 700; color: #58a6ff; }
    .player-sub { font-size: 12px; color: #8b949e; margin-top: 2px; }

    .ar-button {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #1f6feb, #1158c7);
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 30px;
      z-index: 100;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header-info">
    <div class="player-title" id="playerName">CRISTIANO RONALDO</div>
    <div class="player-sub">3D Realny AR Model</div>
  </div>

  <model-viewer 
    id="viewer"
    src="models/model.glb" 
    ar 
    ar-modes="scene-viewer quick-look webxr" 
    ar-scale="auto"
    ar-placement="floor"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    alt="3D Futbolçy Modeli">
    
    <button slot="ar-button" class="ar-button">
      Ýanymda Görkez (3D AR)
    </button>

  </model-viewer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const playerId = urlParams.get('id');

    if (playerId) {
      document.getElementById('playerName').innerText = playerId.toUpperCase();
    }
  </script>

</body>
</html>
