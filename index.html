<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Real AR Football Player</title>

<script type="module"
src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#111827;
font-family:Arial,Helvetica,sans-serif;
}

model-viewer{
width:100%;
height:100%;
background:#111827;

--poster-color:transparent;
}

.header{

position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
z-index:100;

background:rgba(0,0,0,.6);

padding:15px 25px;

border-radius:20px;

backdrop-filter:blur(10px);

color:white;

text-align:center;

}

.header h2{

color:#4da3ff;

letter-spacing:2px;

font-size:20px;

}

.header p{

margin-top:5px;

color:#bbb;

font-size:13px;

}

.ar-button{

position:absolute;

bottom:35px;

left:50%;

transform:translateX(-50%);

border:none;

padding:18px 34px;

border-radius:35px;

font-size:17px;

cursor:pointer;

background:#1976d2;

color:white;

font-weight:bold;

box-shadow:0 8px 30px rgba(0,0,0,.35);

transition:.25s;

}

.ar-button:hover{

background:#0d47a1;

}

.loading{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:rgba(0,0,0,.75);

padding:14px 25px;

border-radius:15px;

color:white;

font-size:15px;

}

</style>

</head>

<body>

<div class="header">

<h2 id="playerName">CRISTIANO RONALDO</h2>

<p>Real 3D Augmented Reality</p>

</div>

<model-viewer

id="viewer"

src="models/model.glb"

alt="Football Player"

ar

ar-modes="webxr scene-viewer quick-look"

ar-placement="floor"

ar-scale="fixed"

camera-controls

touch-action="pan-y"

auto-rotate

rotation-per-second="20deg"

environment-image="neutral"

exposure="1.3"

shadow-intensity="2"

shadow-softness="0.8"

camera-orbit="0deg 75deg 2.8m"

field-of-view="30deg"

scale="1 1 1"

interaction-prompt="auto"

>

<button slot="ar-button" class="ar-button">

📱 Ýanymda Görkez

</button>

<div slot="poster" class="loading">

3D Model ýüklenýär...

</div>

</model-viewer>

<script>

const viewer=document.getElementById("viewer");

const params=new URLSearchParams(window.location.search);

const player=params.get("id");

if(player){

document.getElementById("playerName").innerHTML=player.toUpperCase();

}

viewer.addEventListener("load",()=>{

console.log("Model Loaded");

});

viewer.addEventListener("ar-status",(e)=>{

console.log("AR Status:",e.detail.status);

});

viewer.addEventListener("error",(e)=>{

console.log("Error:",e);

});

</script>

</body>
</html>
