<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realny AR Futbolçy (Image Tracking)</title>

  <!-- A-Frame WebGL Engine -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking Library -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    /* Ýokarky Başlyk UI */
    .header-info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: 20px;
      text-align: center;
      z-index: 999;
      color: white;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .player-title { 
      font-size: 16px; 
      font-weight: 800; 
      color: #58a6ff; 
      letter-spacing: 1px;
      text-transform: uppercase; 
    }
    
    .player-sub { 
      font-size: 11px; 
      color: #8b949e; 
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Ýokarky Maglumat Bar-y -->
  <div class="header-info">
    <div class="player-title" id="playerName">RONALDO</div>
    <div class="player-sub">Kamerany Surata Tutuň</div>
  </div>

  <!-- MindAR Sahnasy -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Model faýlyňyz ýüklenýär -->
      <a-asset-item id="playerModel" src="models/ronaldo.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targets.mind içindäki 1-nji surat (index: 0) üçin AR target -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 
        position="0 0 0" : Suratyň gaty ortasy
        rotation="90 0 0": Modeli kartanyň üstünde dik duruzýar
        scale="0.5 0.5 0.5": Model kartadan juda uly ýa-da kiçi bolsa, şu ýerden üýtgediň
      -->
      <a-gltf-model 
        id="modelEntity"
        src="#playerModel" 
        position="0 0 0" 
        rotation="90 0 0" 
        scale="0.5 0.5 0.5">
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const playerId = urlParams.get('id') || 'ronaldo'; 

    const playerName = document.getElementById('playerName');
    const playerModel = document.getElementById('playerModel');

    playerName.innerText = playerId.replace(/[-_]/g, ' ').toUpperCase();
    
    // Model ýoluny dinamiki bellemek (models/ronaldo.glb)
    playerModel.setAttribute('src', `models/${playerId.toLowerCase()}.glb`);
  </script>

</body>
</html>
