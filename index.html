<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Futbolçy</title>
  
  <!-- Model Viewer Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #0d1117; 
      color: #ffffff; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    /* Model Viewer tutuş ekrany eýeleýär */
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Ýokarky Maglumat Bar-y */
    .header-info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      border-radius: 20px;
      text-align: center;
      z-index: 10;
      pointer-events: none; /* Model-i aňsatlyk bilen aýlamagyna päsgel bermezligi üçin */
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .player-title { 
      font-size: 18px; 
      font-weight: 700; 
      color: #58a6ff; 
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .player-sub { 
      font-size: 11px; 
      color: #8b949e; 
      margin-top: 2px; 
    }

    /* AR Düğmesi (Öňe çykaryldy we basylar ýaly z-index ýokarlandyryldy) */
    .ar-button {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #238636, #1f6feb);
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      z-index: 100; /* Basylman galmazlygy üçin öňe geçirildi */
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(31, 111, 235, 0.5);
      white-space: nowrap;
    }

    .ar-button:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Ýokarky Başlyk -->
  <div class="header-info">
    <div class="player-title" id="playerName">RONALDO</div>
    <div class="player-sub">3D Realny AR Model</div>
  </div>

  <!-- 3D Model Viewer -->
  <model-viewer 
    id="viewer"
    src="models/ronaldo.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-scale="auto"
    ar-placement="floor"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    shadow-softness="0.8"
    power-preference="high-performance"
    loading="eager"
    alt="3D Futbolçy Modeli">
    
    <button slot="ar-button" class="ar-button">
      Ýanymda Görkez (3D AR)
    </button>

  </model-viewer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    // URL-de id bolmasa "ronaldo" bolup açylar
    const playerId = urlParams.get('id') || 'ronaldo'; 

    const viewer = document.getElementById('viewer');
    const playerName = document.getElementById('playerName');

    // Futbolçynyň adyny üýtgetmek
    playerName.innerText = playerId.replace(/[-_]/g, ' ').toUpperCase();
    
    // Model faýlynyň ýoluny bellenilýär (Körünýän ähli harplar kiçi harp bilen: models/ronaldo.glb)
    viewer.src = `models/${playerId.toLowerCase()}.glb`;
  </script>

</body>
</html>
