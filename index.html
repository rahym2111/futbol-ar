<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Futbolçy</title>
  
  <!-- Model Viewer & QR Code Generator Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      background-color: #0d1117; 
      color: #ffffff; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      will-change: transform;
    }

    /* Ýokarky Maglumat Bar-y */
    .header-info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 24px;
      border-radius: 20px;
      text-align: center;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .player-title { 
      font-size: 18px; 
      font-weight: 700; 
      color: #58a6ff; 
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .player-sub { 
      font-size: 11px; 
      color: #8b949e; 
      margin-top: 2px; 
    }

    /* AR Düğmesi (Mobil üçin) */
    .ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #238636, #1f6feb);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 50px;
      z-index: 10;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(31, 111, 235, 0.4);
    }

    /* QR Kod Düwmesi (Kompýuterde görkezip telefona skan etdirmek üçin) */
    .qr-toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(22, 27, 34, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      z-index: 10;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* QR Kod Modal Pencerasy */
    .qr-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      z-index: 100;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .qr-modal h3 { font-size: 14px; margin-bottom: 12px; color: #8b949e; }
    #qrcode { background: #ffffff; padding: 10px; border-radius: 8px; display: inline-block; }
    .close-qr { margin-top: 12px; background: #21262d; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Ýokarky Başlyk -->
  <div class="header-info">
    <div class="player-title" id="playerName">RONALDO</div>
    <div class="player-sub">3D Realny AR Model</div>
  </div>

  <!-- QR Kod Düwmesi -->
  <button class="qr-toggle-btn" onclick="toggleQR()">
    📱 QR Kody Görkez
  </button>

  <!-- QR Pop-up Modal -->
  <div class="qr-modal" id="qrModal">
    <h3>Telefonyňyz bilen skan ediň:</h3>
    <div id="qrcode"></div>
    <br>
    <button class="close-qr" onclick="toggleQR()">Ýap</button>
  </div>

  <!-- 3D Model Viewer -->
  <model-viewer 
    id="viewer"
    src="models/ronaldo.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-scale="auto"
    ar-placement="floor"
    camera-controls 
    touch-action="pan-y"
    shadow-intensity="1"
    shadow-softness="0.8"
    power-preference="high-performance"
    loading="eager"
    alt="3D Futbolçy Modeli">
    
    <button slot="ar-button" class="ar-button">
      Ýanymda Görkez (3D AR)
    </button>

  </model-viewer>

  <script>
    // URL parametrik gözleg (mysal üçin: site.com/?id=messi)
    const urlParams = new URLSearchParams(window.location.search);
    const playerId = urlParams.get('id') || 'ronaldo'; // ID ýazylmasa avtomat ronaldo açar

    const viewer = document.getElementById('viewer');
    const playerName = document.getElementById('playerName');

    // Futbolçynyn adyny we modelini düzeltmek
    playerName.innerText = playerId.replace(/[-_]/g, ' ').toUpperCase();
    viewer.src = `models/${playerId.toLowerCase()}.glb`;

    // Häzirki sahypanyň URL-y boýunça QR kod döretmek
    const currentUrl = window.location.href;
    new QRCode(document.getElementById("qrcode"), {
      text: currentUrl,
      width: 160,
      height: 160
    });

    // QR Modaly açyp/ýapmak
    function toggleQR() {
      const modal = document.getElementById('qrModal');
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }
  </script>

</body>
</html>
