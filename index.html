<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Futbolçy Karta</title>

  <!-- A-Frame Engine -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR Engine -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Gesture Detector (Barmak bilen dolandyrmak üçin) -->
  <script src="https://cdn.jsdelivr.net/gh/fcor/aframe-gesture-detector/dist/aframe-gesture-detector.min.js"></script>

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }

    /* VR düwmesini we MindAR UI-lary gizlemek */
    .a-enter-vr, .mindar-ui-overlay {
      display: none !important;
    }

    /* Ýokarky Maglumat Bar-y */
    .header-info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: 20px;
      text-align: center;
      z-index: 999;
      color: white;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .player-title { 
      font-size: 16px; 
      font-weight: 800; 
      color: #58a6ff; 
      letter-spacing: 1px;
      text-transform: uppercase; 
    }
    
    .player-sub { 
      font-size: 11px; 
      color: #8b949e; 
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="header-info">
    <div class="player-title" id="playerName">RONALDO</div>
    <div class="player-sub" id="statusText">Kartany Kamera Görkeziň</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    gesture-detector>
    
    <a-assets>
      <a-asset-item id="playerModel" src="models/ronaldo.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Entity -->
    <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
      
      <!-- 3D Model: position, rotation, scale we barmak bilen dolandyrgyç -->
      <a-gltf-model 
        id="modelEntity"
        class="cantarget"
        src="#playerModel" 
        position="0 0 0" 
        rotation="90 0 0" 
        scale="0.5 0.5 0.5"
        gesture-handler="minScale: 0.1; maxScale: 3;">
      </a-gltf-model>

    </a-entity>
  </a-scene>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const playerId = urlParams.get('id') || 'ronaldo'; 

    const playerName = document.getElementById('playerName');
    const playerModel = document.getElementById('playerModel');
    const statusText = document.getElementById('statusText');
    const targetEntity = document.getElementById('targetEntity');
    const modelEntity = document.getElementById('modelEntity');

    playerName.innerText = playerId.replace(/[-_]/g, ' ').toUpperCase();
    playerModel.setAttribute('src', `models/${playerId.toLowerCase()}.glb`);

    // --- MODELI ARKA TARAPDAN / GYŞARDANYŇDA ÝITIRMEZLIK SCRIPT-I ---
    let hasBeenFound = false;

    targetEntity.addEventListener("targetFound", () => {
      hasBeenFound = true;
      statusText.innerText = "Model Baglandy (Barmak bilen aýlap bilersiňiz)";
      statusText.style.color = "#3fb950";
    });

    targetEntity.addEventListener("targetLost", () => {
      // Eger bir gezek tanalan bolsa, kamera suraty ýitirse hem modeli ekrandan AÝYRMAÝARYS!
      if (hasBeenFound) {
        // Model görünýän bolup galsyn diýip visiblity-ni mejburi 'true' saklaýarys
        modelEntity.setAttribute('visible', 'true');
        statusText.innerText = "3D Görünüş (Kartadan Daşlaşyldy)";
        statusText.style.color = "#d29922";
      }
    });
  </script>

</body>
</html>
